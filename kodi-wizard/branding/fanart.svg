<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a2a;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- Decorative circles (abstract design) -->
  <circle cx="1600" cy="200" r="150" fill="#7B2CBF" opacity="0.15"/>
  <circle cx="300" cy="800" r="200" fill="#9D4EDD" opacity="0.1"/>
  <circle cx="1700" cy="900" r="120" fill="#C77DFF" opacity="0.12"/>

  <!-- Large pigeon silhouette on left -->
  <g transform="translate(200, 300)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="180" ry="200" fill="#7B2CBF" opacity="0.4"/>
    <!-- Head -->
    <ellipse cx="0" cy="-150" rx="100" ry="110" fill="#9D4EDD" opacity="0.4"/>
    <!-- Wing -->
    <ellipse cx="-20" cy="50" rx="140" ry="90" fill="#C77DFF" opacity="0.35"/>
    <!-- Iridescent highlight -->
    <ellipse cx="50" cy="-80" rx="35" ry="50" fill="#10A5B5" opacity="0.5" filter="url(#glow)"/>
  </g>

  <!-- Grid lines (tech aesthetic) -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#10A5B5" stroke-width="1" opacity="0.15"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#10A5B5" stroke-width="1" opacity="0.15"/>

  <!-- Main title on right side -->
  <text x="1100" y="450" font-family="Arial, sans-serif" font-size="120" font-weight="bold"
        fill="#ffffff" filter="url(#glow)">PIGEON</text>
  <text x="1100" y="530" font-family="Arial, sans-serif" font-size="56"
        fill="#10A5B5" filter="url(#glow)">BUILD</text>

  <!-- Subtitle -->
  <text x="1100" y="600" font-family="Arial, sans-serif" font-size="32"
        fill="#C77DFF" opacity="0.8">Fast • Reliable • Optimized</text>

  <!-- Bottom tagline -->
  <text x="960" y="1000" font-family="Arial, sans-serif" font-size="24"
        text-anchor="middle" fill="#9D4EDD" opacity="0.6">
    Your Ultimate Kodi Streaming Experience
  </text>
</svg>
